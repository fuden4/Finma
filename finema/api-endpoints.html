<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finma API Endpoints</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #222633;
      --border: #2d3348;
      --text: #e4e6ef;
      --text-muted: #8b90a5;
      --accent: #6c63ff;
      --get: #22c55e;
      --post: #3b82f6;
      --put: #f59e0b;
      --patch: #a855f7;
      --delete: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .controls input,
    .controls select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      outline: none;
    }

    .controls input { flex: 1; min-width: 200px; }
    .controls input:focus,
    .controls select:focus { border-color: var(--accent); }

    .stats {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

    .section {
      margin-bottom: 2rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .section-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .section-count {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    .endpoint {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.35rem;
      background: var(--surface);
      border: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }

    .endpoint:hover {
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .method {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.25rem 0;
      text-align: center;
      border-radius: 4px;
      align-self: start;
      margin-top: 0.1rem;
    }

    .method.GET    { background: color-mix(in srgb, var(--get) 18%, transparent); color: var(--get); }
    .method.POST   { background: color-mix(in srgb, var(--post) 18%, transparent); color: var(--post); }
    .method.PUT    { background: color-mix(in srgb, var(--put) 18%, transparent); color: var(--put); }
    .method.PATCH  { background: color-mix(in srgb, var(--patch) 18%, transparent); color: var(--patch); }
    .method.DELETE { background: color-mix(in srgb, var(--delete) 18%, transparent); color: var(--delete); }

    .endpoint-path {
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 0.875rem;
      word-break: break-all;
    }

    .endpoint-desc {
      grid-column: 2;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: -0.25rem;
    }

    .endpoint-file {
      grid-column: 2;
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.6;
      font-family: monospace;
      margin-top: -0.15rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .badge.auth { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
    .badge.admin { background: color-mix(in srgb, var(--delete) 15%, transparent); color: #f87171; }
    .badge.multipart { background: color-mix(in srgb, var(--put) 15%, transparent); color: var(--put); }

    .note {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .note strong { color: var(--text); }

    .hidden { display: none !important; }

  </style>
</head>
<body>

<header>
  <h1>Finma API Endpoints</h1>
  <p id="subtitle">Next.js App Router API reference</p>
  <div class="controls">
    <input type="search" id="search" placeholder="Search paths, methods, descriptions…" autofocus />
    <select id="method-filter">
      <option value="">All methods</option>
      <option value="GET">GET</option>
      <option value="POST">POST</option>
      <option value="PUT">PUT</option>
      <option value="PATCH">PATCH</option>
      <option value="DELETE">DELETE</option>
    </select>
    <select id="section-filter">
      <option value="">All sections</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div class="note">
    <strong>Base URL:</strong> <code>/api</code> (relative to the Next.js app).<br />
    <strong>Rewrites:</strong> <code>GET /images/*</code> &rarr; <code>/api/uploads/*</code> &nbsp;|&nbsp;
    <code>GET /videos/*</code> &rarr; <code>/api/videos/*</code><br />
    <strong>Auth:</strong> Most user routes require a session. All <code>/api/admin/*</code> routes require admin role.
  </div>

  <div id="endpoints"></div>
</main>

const tagLabels = { auth: "auth required", admin: "admin only", multipart: "multipart" };

function renderBadges(tags = []) {
  return tags.map(t => `<span class="badge ${t}">${tagLabels[t] || t}</span>`).join("");
}

function render() {
  const container = document.getElementById("endpoints");
  const total = sections.reduce((n, s) => n + s.endpoints.length, 0);
  container.innerHTML = sections.map((section, si) => `
    <div class="section" data-section="${si}">
      <div class="section-header">
        <h2>${section.name}</h2>
        <span class="section-count">${section.endpoints.length}</span>
      </div>
      ${section.endpoints.map(ep => `
        <div class="endpoint" data-method="${ep.method}" data-section="${si}"
             data-search="${(ep.method + ' ' + ep.path + ' ' + ep.desc + ' ' + ep.file).toLowerCase()}">
          <span class="method ${ep.method}">${ep.method}</span>
          <div>
            <div class="endpoint-path">${ep.path}${renderBadges(ep.tags)}</div>
            <div class="endpoint-desc">${ep.desc}</div>
            <div class="endpoint-file">${ep.file}</div>
          </div>
        </div>
      `).join("")}
    </div>
  `).join("");

  document.getElementById("subtitle").textContent =
    `Next.js App Router — ${total} endpoints across 71 route files`;
  document.getElementById("stats").textContent = `Showing ${total} of ${total} endpoints`;

  const sectionFilter = document.getElementById("section-filter");
  sections.forEach((s, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = s.name;
    sectionFilter.appendChild(opt);
  });
}

function filter() {
  const q = document.getElementById("search").value.toLowerCase();
  const method = document.getElementById("method-filter").value;
  const section = document.getElementById("section-filter").value;
  let visible = 0;
  const total = document.querySelectorAll(".endpoint").length;

  document.querySelectorAll(".section").forEach(sec => {
    const si = sec.dataset.section;
    if (section !== "" && si !== section) {
      sec.classList.add("hidden");
      return;
    }
    let sectionVisible = 0;
    sec.querySelectorAll(".endpoint").forEach(ep => {
      const matchSearch = !q || ep.dataset.search.includes(q);
      const matchMethod = !method || ep.dataset.method === method;
      const show = matchSearch && matchMethod;
      ep.classList.toggle("hidden", !show);
      if (show) { visible++; sectionVisible++; }
    });
    sec.classList.toggle("hidden", sectionVisible === 0);
  });

  document.getElementById("stats").textContent = `Showing ${visible} of ${total} endpoints`;
}

document.getElementById("search").addEventListener("input", filter);
document.getElementById("method-filter").addEventListener("change", filter);
document.getElementById("section-filter").addEventListener("change", filter);

render();
</script>
